<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KIOSK Management</title>
  <style>
    :root {
      --bg: #eef3f9;
      --panel: #ffffff;
      --text: #18212f;
      --muted: #667085;
      --line: #d8e0ea;
      --accent: #4f6bed;
      --danger: #dc4c64;
      --shadow: 0 16px 40px rgba(25, 40, 70, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f7f9fc 0%, #eef3f9 100%);
      color: var(--text);
    }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 24px; }
    .topbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .topbar h1 { margin: 0; font-size: clamp(1.5rem, 2.5vw, 2.2rem); }
    .button { cursor: pointer; border: 1px solid transparent; border-radius: 14px; padding: 12px 16px; font-weight: 700; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .button:hover { transform: translateY(-1px); }
    .button-primary { background: linear-gradient(180deg, #5d77ef, #415fdd); color: white; }
    .button-secondary { background: #f8fafc; color: var(--text); border-color: var(--line); }
    .button-danger { background: linear-gradient(180deg, #ea5b76, #d9415e); color: white; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 700; color: var(--text); }
    input, select { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; }
    input:focus, select:focus { outline: none; border-color: #9cb0ff; box-shadow: 0 0 0 4px rgba(79,107,237,0.12); }
    .message { margin-bottom: 20px; padding: 14px 16px; border-radius: 14px; border: 1px solid transparent; display: none; }
    .message.info { background: #eef3ff; border-color: #d7e0ff; color: #1f2d58; }
    .message.success { background: #ecfdf3; border-color: #bbf7d0; color: #134e4a; }
    .message.error { background: #ffe7ea; border-color: #f5c2c7; color: #881337; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 14px; border-bottom: 1px solid #edf1f6; text-align: left; font-size: 14px; }
    th { background: #fbfcfe; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 12px; }
    .empty-state { padding: 24px; text-align: center; color: var(--muted); }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; background: #eef3ff; color: #3550a1; }
    @media (max-width: 820px) { .topbar { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="topbar">
      <div>
        <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px;">Super Admin</div>
        <h1>Manage KIOSKs</h1>
        <p style="margin: 8px 0 0; color: var(--muted); max-width: 54ch;">Select an organization, then add, delete, or reset PINs for kiosks in that org.</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button class="button button-secondary" id="back-btn">← Back</button>
      </div>
    </div>

    <div class="panel">
      <div class="message" id="message"></div>

      <div class="form-grid">
        <div class="form-group">
          <label for="org-select">Organization</label>
          <select id="org-select"><option value="">Loading organizations...</option></select>
        </div>
        <div class="form-group">
          <label for="kiosk-name">KIOSK Name</label>
          <input id="kiosk-name" type="text" placeholder="Front desk kiosk" />
        </div>
        <div class="form-group">
          <label for="kiosk-pin">PIN (4-6 digits)</label>
          <input id="kiosk-pin" type="password" inputmode="numeric" placeholder="1234" />
        </div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 20px;">
        <button class="button button-primary" id="create-kiosk-btn">Create KIOSK</button>
        <button class="button button-secondary" id="refresh-orgs-btn">Refresh organizations</button>
      </div>

      <div id="kiosk-list-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 style="margin:0; font-size:1rem;">KIOSK Terminals</h2>
          <div id="kiosk-count" style="color: var(--muted);">0 kiosks</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Status</th><th>Created</th><th>KIOSK ID</th><th>Actions</th></tr>
            </thead>
            <tbody id="kiosk-table-body">
              <tr><td colspan="5" class="empty-state">Select an organization to load kiosks.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="kiosk-management.js"></script>
</body>
</html>
